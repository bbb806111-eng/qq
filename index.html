<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Storyboard Infinity Canvas</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="toolbar">
      <div class="group">
        <button data-add="shot">+ 分镜</button>
        <button data-add="image">+ 图片</button>
        <button data-add="video">+ 视频</button>
      </div>
      <div class="group">
        <button id="resetView">重置视图</button>
        <button id="exportData">导出 JSON</button>
        <label class="import-label">
          导入 JSON
          <input id="importData" type="file" accept="application/json" />
        </label>
      </div>
      <span id="hint">拖动画布空白区域可平移，滚轮缩放，拖动卡片可布局。</span>
    </header>

    <main id="viewport">
      <div id="grid"></div>
      <div id="canvas"></div>
      <svg id="links" xmlns="http://www.w3.org/2000/svg"></svg>
    </main>

    <template id="cardTemplate">
      <article class="card">
        <header>
          <h3 contenteditable="true"></h3>
          <small class="type-badge"></small>
        </header>
        <textarea class="desc" placeholder="写下场景、镜头、旁白或制作说明..."></textarea>
        <div class="asset-wrap"></div>
      </article>
    </template>

    <script src="app.js"></script>
  </body>
</html>
